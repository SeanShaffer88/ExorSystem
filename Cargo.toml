[workspace]
resolver = "3"
members = ["crates/exor-storage", "crates/exor-engine", "crates/exor-fs", "crates/exor-win", "crates/exor-cli"]
exclude = ["gui/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["ProTechSean"]
repository = "https://github.com/SeanShaffer88/ExorSystem"

[workspace.dependencies]
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["fs", "rt-multi-thread", "sync", "macros", "time"] }
blake3 = "=1.8.7"
windows = "=0.62.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
