[package]
name = "exorsystem-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["ProTechSean"]
description = "ExorSystem desktop shell (Tauri v2)"

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = [] }
tauri-plugin-window-state = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
exor-storage = { path = "../../crates/exor-storage" }
exor-engine = { path = "../../crates/exor-engine" }

[target.'cfg(windows)'.dependencies]
exor-win = { path = "../../crates/exor-win" }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace]
