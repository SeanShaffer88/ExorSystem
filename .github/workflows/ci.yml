name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Rust (Linux) fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Dependency licenses must be free/open source
        run: python3 scripts/check-licenses.py
      - run: cargo fmt --all -- --check
      - run: bash scripts/desktop-ci-diagnostics.sh cargo clippy --workspace --all-targets --locked -- -D warnings
        shell: bash
      - run: bash scripts/desktop-ci-diagnostics.sh cargo test --workspace --locked
        shell: bash

  rust-windows:
    name: Rust (Windows) build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/desktop-ci-diagnostics.sh cargo clippy --workspace --all-targets --locked -- -D warnings
        shell: bash
      - run: bash scripts/desktop-ci-diagnostics.sh cargo test --workspace --locked
        shell: bash

  gui:
    name: GUI build and Tauri shell check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: Frontend type-check and build
        working-directory: gui
        run: |
          npm ci
          npm run build
      - name: Browser smoke (mocked desktop IPC)
        working-directory: gui
        run: |
          npx playwright-core install --only-shell chromium
          npm run test:ui
      - name: Tauri shell
        working-directory: gui/src-tauri
        shell: bash
        run: |
          cargo fmt --check
          bash ../../scripts/desktop-ci-diagnostics.sh cargo clippy --locked -- -D warnings
