name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri
      - name: Build artifacts
        shell: pwsh
        run: ./scripts/release.ps1
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes (Get-ChildItem dist/ExorSystem-v* ) dist/SHA256SUMS.txt
