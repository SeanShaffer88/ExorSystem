name: Published Windows package evidence (no launch)

on:
  pull_request:
    paths:
      - '.github/workflows/windows-published-evidence.yml'
      - 'scripts/verify-published-release.py'
      - 'scripts/verify-release-candidate.py'
      - 'scripts/windows-client-smoke.ps1'
      - 'scripts/tests/test_published_release.py'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact stable tag with the five published package and evidence assets
        required: true
        default: v0.3.0
        type: string

permissions:
  contents: read

jobs:
  published-packages:
    name: Check published Windows assets without executing them
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test the static verifier
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Check client runner syntax and server refusal
        shell: pwsh
        run: |
          $path = (Resolve-Path -LiteralPath './scripts/windows-client-smoke.ps1').Path
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $out = Join-Path $env:RUNNER_TEMP ('exor-server-refusal-' + [guid]::NewGuid().ToString('N'))
          $refused = $false
          try {
            & $path -Tag v0.3.0 -Format Portable -DisposableClient -ArtifactDir missing -ReleaseInfo missing -DesktopExe missing -EvidenceDir $out
          } catch {
            if ($_.Exception.Message -notlike 'Use an interactive Windows 10/11 x64 client*') { throw }
            $refused = $true
          }
          if (-not $refused -or (Test-Path -LiteralPath $out)) { throw 'The runner did not refuse a Windows Server launch test before writes.' }
      - name: Fetch and verify the exact official release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.3.0' }}
        run: |
          $repo = 'SeanShaffer88/ExorSystem'
          $tag = $env:RELEASE_TAG
          $root = Join-Path $env:RUNNER_TEMP 'exor-published'
          $packages = Join-Path $root 'packages'
          $report = Join-Path $root 'packages.json'
          New-Item -ItemType Directory -Path $packages | Out-Null
          $stage = 'select an exact stable tag'
          try {
            if ($tag -cnotmatch '^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}\z') { throw 'Enter an exact stable tag such as v0.3.0.' }
            $stage = 'fetch official release metadata'
            $release = gh api "repos/$repo/releases/tags/$tag"
            if ($LASTEXITCODE) { throw 'Could not read the official release metadata.' }
            $stage = 'confirm the published tag target'
            $ref = gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.type + ":" + .object.sha'
            if ($LASTEXITCODE -or $ref -cne ('commit:' + ($release | ConvertFrom-Json).target_commitish)) { throw 'The release source does not match the published tag.' }
            $info = Join-Path $root 'release.json'
            $release | Set-Content -LiteralPath $info -Encoding utf8
            $stage = 'download the official release assets'
            gh release download $tag --repo $repo --dir $packages
            if ($LASTEXITCODE) { throw 'Could not download the official release assets.' }
            $stage = 'run the static verifier'
            python -B scripts/verify-published-release.py $packages --release-info $info --tag $tag --output $report
            if ($LASTEXITCODE) { throw 'Published package verification failed.' }
            @(
              "### $tag published Windows packages: static checks passed"
              ''
              'The NSIS installer, MSI, portable ZIP, and both evidence files matched the published release.'
              'No installer or desktop ran. All Windows 10/11 client checks remain untested by this job.'
              'See `packages.json` in the **ExorSystem-published-package-evidence** artifact.'
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          } catch {
            if (-not (Test-Path -LiteralPath $report)) {
              [ordered]@{
                schema = 1
                kind = 'published-windows-package-checks-only'
                checked_at_utc = [datetime]::UtcNow.ToString('o')
                requested_tag = $tag
                status = 'Blocked'
                stopped_at = $stage
                not_tested = @('Package bytes and structure', 'All native Windows client checks')
              } | ConvertTo-Json | Set-Content -LiteralPath $report -Encoding utf8
            }
            throw
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ExorSystem-published-package-evidence
          path: ${{ runner.temp }}/exor-published/packages.json
          if-no-files-found: ignore
          retention-days: 30
